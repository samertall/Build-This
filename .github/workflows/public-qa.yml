name: Public QA (no credentials)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-browser-and-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck workspace
        run: pnpm run typecheck
      - name: Run safe AI, authentication, and routing unit tests
        run: pnpm exec vitest run --config vitest.config.ts tests/ai-guard.integration.test.ts tests/ai-provider-error.integration.test.ts tests/ai-quota.integration.test.ts tests/preview-api-routing.integration.test.ts tests/api-session-token.integration.test.ts
      - name: Install Chromium browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Test public pages and responsive layouts
        run: pnpm exec playwright test --config playwright.public.config.ts
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: public-page-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  database-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qa_user
          POSTGRES_PASSWORD: qa_password
          POSTGRES_DB: build_this_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa_user -d build_this_qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://qa_user:qa_password@localhost:5432/build_this_qa
      NODE_ENV: test
      ALLOW_AI_MOCK_FALLBACK: "true"
      OPENAI_API_KEY: ci-test-key-no-network
      AI_DAILY_USER_STAGE_LIMIT: "6"
      AI_DAILY_GLOBAL_STAGE_LIMIT: "6"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace libraries for integration imports
        run: pnpm run typecheck:libs
      - name: Initialize disposable local database
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f lib/db/migrations/0001_build_this_initial.sql
      - name: Test project-to-export workflow, permissions, and quotas
        run: pnpm exec vitest run --config vitest.config.ts tests/full-workflow.integration.test.ts tests/ai-provider-billing.integration.test.ts tests/presentation-export.integration.test.ts tests/presentation-order.integration.test.ts tests/team-access.integration.test.ts
